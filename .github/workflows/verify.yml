name: verify

# This repository's central claim is that every reported number regenerates from committed code.
# A claim like that should be tested by a machine that is not the author's, on every push, or it is
# an assertion rather than a property. Each job below checks one part of it and nothing else, so a
# failure names what broke.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monthly: catches the raw-data sources going away or changing their bytes, which would break
    # reproduction for a reader long before anyone here noticed.
    - cron: "0 6 1 * *"

permissions:
  contents: read

env:
  PY_VERSION: "3.12"

jobs:
  tests:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip
      - name: install the pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
      - name: run the suite
        run: PYTHONPATH=src:experiments python -m pytest tests/ -q
        # 21 pass and 6 skip without raw data on disk; the skips are reported as skips rather than
        # counted as passes, so this job cannot show a hollow green. The full-data run is the
        # `reproduce` job below.

  integrity:
    name: manifests and provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: results manifest verifies from a fresh clone
        run: python scripts/make_results_manifest.py --check
      - name: every committed result traces to committed code
        run: python scripts/provenance_map.py --check
      - name: per-folder manifests verify
        run: |
          fail=0
          for d in results/enrichments/*/; do
            if [ -f "$d/MANIFEST.sha256" ]; then
              ( cd "$d" && sha256sum -c MANIFEST.sha256 >/dev/null ) || { echo "FAILED: $d"; fail=1; }
            fi
          done
          exit $fail

  reproduce:
    name: headline number regenerates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip
      - name: install the pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
      - name: fetch and hash-verify the raw datasets
        run: PYTHONPATH=src python experiments/fetch_data.py
      - name: full suite, with raw data present
        run: PYTHONPATH=src:experiments python -m pytest tests/ -q
      - name: the worked clinical example regenerates from the committed caches
        # The paper's most quotable finding: a one-feature model moves 203 of 961 biopsy decisions,
        # 21.1 %, of which 4 malignant cases lose their recommendation. If this drifts, the claim
        # a reader is most likely to check has drifted.
        run: |
          PYTHONPATH=src python experiments/worked_example.py >/dev/null
          python - <<'EOF'
          import json, sys
          d = json.load(open("results/worked_example.json"))["worked_example"]
          expect = {"n_patients": 961, "n_flip_majority": 203,
                    "n_flip_ever": 257, "n_missed_treatment": 4}
          bad = {k: (v, d[k]) for k, v in expect.items() if d[k] != v}
          if bad:
              print("REGENERATED VALUES DIFFER (expected, got):", bad); sys.exit(1)
          print(f"ok: {d['n_patients']} patients, {d['n_flip_majority']} majority flips "
                f"({100*d['n_flip_majority']/d['n_patients']:.1f} %), "
                f"{d['n_missed_treatment']} moved off treatment")
          EOF
      - name: the two cache-only audit arms reproduce
        run: |
          PYTHONPATH=src python experiments/enrichments/compute_dataset_level_inference.py
          PYTHONPATH=src python experiments/enrichments/compute_flip_decomposition.py
          # Values, not bytes: re-running on a different platform writes different line endings
          # while computing identical numbers. See the caveat in REPRODUCE.md.
          python - <<'EOF'
          import csv, sys
          rows = list(csv.DictReader(open(
              "results/enrichments/18_decision_flip_decomposition/flip_decomposition.csv")))
          r = next(x for x in rows
                   if x["example"] == "worked_example" and x["preregistered"] == "True")
          checks = {"n_flip_majority": "203", "newly_recommended": "188", "withdrawn": "15",
                    "pos_newly_recommended": "11", "pos_withdrawn": "4"}
          bad = {k: (v, r[k]) for k, v in checks.items() if r[k] != v}
          if bad:
              print("DECOMPOSITION DIFFERS (expected, got):", bad); sys.exit(1)
          print("ok: decomposition reproduces", checks)
          EOF
